<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Resultado del examen</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

    <div class="container mt-5">


        <div class="text-center mb-4">

            <h1>
                Resultado del examen
            </h1>

        </div>




        <div class="card mb-4">

            <div class="card-body">

                <h2>
                    Datos del alumno
                </h2>

                <hr>

                <p>
                    <strong>Nombre:</strong>
                    Juan
                </p>

                <p>
                    <strong>Apellido:</strong>
                    Pérez
                </p>

            </div>

        </div>



        <div class="card text-center mb-4">

            <div class="card-body">

                <h2>
                    Nota
                </h2>

                <hr>

                <h1 id="nota">
                    0/10
                </h1>

            </div>

        </div>




        <div class="row g-4">




            <div class="col-md-6">

                <div class="card h-100">

                    <div class="card-body">

                        <h2>
                            Preguntas correctas
                        </h2>

                        <hr>

                        <div id="preguntasCorrectas">

                        </div>

                    </div>

                </div>

            </div>



           

            <div class="col-md-6">

                <div class="card h-100">

                    <div class="card-body">

                        <h2>
                            Preguntas incorrectas
                        </h2>

                        <hr>

                        <div id="preguntasIncorrectas">

                        </div>

                    </div>

                </div>

            </div>


        </div>



        <div class="text-center mt-4 mb-5">

            <a href="principal.html">

                <button
                    type="button"
                    class="btn btn-secondary"
                >
                    Volver al inicio
                </button>

            </a>

        </div>


    </div>



    <script>


        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const nota =
            parametros.get("nota");


        const correctas =
            parametros.get("correctas");


        const incorrectas =
            parametros.get("incorrectas");



        if (nota !== null) {

            document
                .getElementById("nota")
                .textContent =
                nota + "/10";

        }



        const contenedorCorrectas =
            document.getElementById(
                "preguntasCorrectas"
            );


        if (
            correctas !== null &&
            correctas !== ""
        ) {


            const lista =
                correctas.split(";");


            lista.forEach(
                function(pregunta) {


                    const p =
                        document.createElement("p");


                    p.textContent =
                        pregunta;


                    contenedorCorrectas.appendChild(p);

                }
            );


        } else {


            const p =
                document.createElement("p");


            p.textContent =
                "No respondió correctamente ninguna pregunta.";


            contenedorCorrectas.appendChild(p);

        }



        const contenedorIncorrectas =
            document.getElementById(
                "preguntasIncorrectas"
            );


        if (
            incorrectas !== null &&
            incorrectas !== ""
        ) {


            const lista =
                incorrectas.split(";");


            lista.forEach(
                function(pregunta) {


                    const datos =
                        pregunta.split("|");


                    const preguntaTexto =
                        document.createElement("p");


                    preguntaTexto.textContent =
                        datos[0];


                    contenedorIncorrectas.appendChild(
                        preguntaTexto
                    );


                    const respuesta =
                        document.createElement("p");


                    respuesta.innerHTML =
                        "<strong>" +
                        datos[1] +
                        "</strong>";


                    contenedorIncorrectas.appendChild(
                        respuesta
                    );


                }
            );


        } else {


            const p =
                document.createElement("p");


            p.textContent =
                "No hay preguntas incorrectas.";


            contenedorIncorrectas.appendChild(p);

        }


    </script>


</body>

</html>
</html>
