<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Examen</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

    <div class="container mt-5">


        <div class="text-center mb-4">

            <h1>
                Examen de Matemática
            </h1>

            <p>
                Responda las siguientes preguntas.
            </p>

        </div>



        <form id="formularioExamen">



            <div class="card mb-4">

                <div class="card-body">

                    <h2>
                        Pregunta 1
                    </h2>

                    <hr>

                    <p>
                        ¿Cuál es el resultado de 5 + 7?
                    </p>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta1"
                            id="p1a"
                            value="12"
                        >

                        <label
                            class="form-check-label"
                            for="p1a"
                        >
                            12
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta1"
                            id="p1b"
                            value="10"
                        >

                        <label
                            class="form-check-label"
                            for="p1b"
                        >
                            10
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta1"
                            id="p1c"
                            value="15"
                        >

                        <label
                            class="form-check-label"
                            for="p1c"
                        >
                            15
                        </label>

                    </div>

                </div>

            </div>




            <div class="card mb-4">

                <div class="card-body">

                    <h2>
                        Pregunta 2
                    </h2>

                    <hr>

                    <p>
                        Resolver la siguiente ecuación:
                        2x + 4 = 10.
                    </p>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta2"
                            id="p2a"
                            value="2"
                        >

                        <label
                            class="form-check-label"
                            for="p2a"
                        >
                            x = 2
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta2"
                            id="p2b"
                            value="3"
                        >

                        <label
                            class="form-check-label"
                            for="p2b"
                        >
                            x = 3
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta2"
                            id="p2c"
                            value="4"
                        >

                        <label
                            class="form-check-label"
                            for="p2c"
                        >
                            x = 4
                        </label>

                    </div>

                </div>

            </div>




            <div class="card mb-4">

                <div class="card-body">

                    <h2>
                        Pregunta 3
                    </h2>

                    <hr>

                    <p>
                        ¿Cuál es el área de un cuadrado
                        de 5 cm de lado?
                    </p>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta3"
                            id="p3a"
                            value="10"
                        >

                        <label
                            class="form-check-label"
                            for="p3a"
                        >
                            10 cm²
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta3"
                            id="p3b"
                            value="20"
                        >

                        <label
                            class="form-check-label"
                            for="p3b"
                        >
                            20 cm²
                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="pregunta3"
                            id="p3c"
                            value="25"
                        >

                        <label
                            class="form-check-label"
                            for="p3c"
                        >
                            25 cm²
                        </label>

                    </div>

                </div>

            </div>




            <div class="text-center mb-5">

                <button
                    type="submit"
                    class="btn btn-success btn-lg"
                >
                    Entregar examen
                </button>

            </div>


        </form>

    </div>



    <script>

        document
            .getElementById("formularioExamen")
            .addEventListener("submit", function(evento) {

                evento.preventDefault();



                const respuestasCorrectas = {

                    pregunta1: "12",

                    pregunta2: "3",

                    pregunta3: "25"

                };


                let cantidadCorrectas = 0;

                let correctas = [];

                let incorrectas = [];



                for (let i = 1; i <= 3; i++) {


                    const respuesta =
                        document.querySelector(
                            'input[name="pregunta' + i + '"]:checked'
                        );


                    if (respuesta === null) {

                        alert(
                            "Debe responder todas las preguntas."
                        );

                        return;

                    }


                    const respuestaCorrecta =
                        respuestasCorrectas[
                            "pregunta" + i
                        ];


                    if (respuesta.value === respuestaCorrecta) {


                        cantidadCorrectas++;


                        correctas.push(
                            "Pregunta " +
                            i +
                            ": Correcta"
                        );


                    } else {


                        let textoCorrecto;


                        if (i === 1) {

                            textoCorrecto = "12";

                        }

                        if (i === 2) {

                            textoCorrecto = "x = 3";

                        }

                        if (i === 3) {

                            textoCorrecto = "25 cm²";

                        }


                        incorrectas.push(
                            "Pregunta " +
                            i +
                            ": Incorrecta|Respuesta correcta: " +
                            textoCorrecto
                        );

                    }

                }



                const nota =
                    (cantidadCorrectas / 3) * 10;


                const notaFinal =
                    nota.toFixed(2);


                const listaCorrectas =
                    correctas.join(";");


                const listaIncorrectas =
                    incorrectas.join(";");



                window.location.href =
                    "resultadoalumno.html?" +
                    "nota=" +
                    encodeURIComponent(notaFinal) +
                    "&correctas=" +
                    encodeURIComponent(listaCorrectas) +
                    "&incorrectas=" +
                    encodeURIComponent(listaIncorrectas);

            });

    </script>


</body>

</html>
