<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4 mb-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h1 class="text-center mb-4">Crear cuenta</h1>

                <form action="../PHP/crearCuenta.php" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre:</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido:</label>
                        <input type="text" name="apellido" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email:</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña:</label>
                        <input type="password" name="contrasena" class="form-control" required>
                    </div>

                    <!-- Tipo de usuario -->
                    <div class="mb-3">
                        <label class="form-label">Tipo de usuario:</label>

                        <select name="tipoUsuario" class="form-select" required>
                            <option value="">Seleccione una opción</option>
                            <option value="alumno">Alumno</option>
                            <option value="profesor">Profesor</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Crear cuenta</button>
                    </div>
                </form>
                <div class="text-center my-3">
                        <span>¿Ya tienes una cuenta?</span>
                    </div>
                    <div class="d-grid">
                        <button type="button" class="btn btn-outline-dark" onclick="window.location.href='index.php'">Inicias Sesión</button>
                    </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
