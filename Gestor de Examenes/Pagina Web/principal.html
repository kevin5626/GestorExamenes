<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card p-4">

                    <h1 class="text-center mb-4">
                        Inicio de sesión
                    </h1>

                    <form action="principal2.html" method="get">

                        <div class="mb-3">

                            <label for="gmail" class="form-label">
                                Gmail:
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="gmail"
                                name="gmail"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label for="contrasena" class="form-label">
                                Contraseña:
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="contrasena"
                                name="contrasena"
                                required
                            >

                        </div>

                        <div class="d-grid">

                            <input
                                type="submit"
                                class="btn btn-primary"
                                value="Iniciar sesión"
                            >

                        </div>

                    </form>

                    <div class="text-center my-3">

                        <span>o</span>

                    </div>

                    <div class="d-grid">

                        <button
                            type="button"
                            class="btn btn-outline-dark"
                        >
                            Iniciar sesión con Google
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
